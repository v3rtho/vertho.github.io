# Served from the custom domain (static/CNAME) on GitHub Pages
baseURL = 'https://vertho.tech/'
locale = 'en-us'
title = 'Vertho'
theme = 'PaperMod'
enableRobotsTXT = true    # robots.txt with a pointer to the sitemap

# Same URL structure as the old WordPress site, so existing links keep working
[permalinks]
  posts = '/:year/:month/:day/:slug/'

[pagination]
  pagerSize = 10

[params]
  description = 'Blogging about (Microsoft) Security and more'
  author = 'Thomas Verheyden'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = 'Vertho | Verheyden Thomas'
    Content = 'Blogging about (Microsoft) Security and more'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/v3rtho'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

[menu]
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = 'about/'
    weight = 10
  [[menu.main]]
    identifier = 'events'
    name = 'Events'
    url = 'events/'
    weight = 20
  [[menu.main]]
    identifier = 'tools'
    name = 'Tools'
    url = 'tools/'
    weight = 25
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = 'posts/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = 'search/'
    weight = 40
  [[menu.main]]
    identifier = 'archives'
    name = 'Archive'
    url = 'archives/'
    weight = 50
  [[menu.main]]
    identifier = 'contact'
    name = 'Contact'
    url = 'contact/'
    weight = 60

# Needed for the search page
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.highlight]
  noClasses = false
